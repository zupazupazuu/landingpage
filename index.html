<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zupazupazuu — Crystal Jewelry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pearl: #f6f1ec;
    --pearl-2: #efe6dd;
    --ink: #2a2130;
    --ink-soft: #5b4f63;
    --rose: #e3b8be;
    --rose-deep: #c98d96;
    --amethyst: #9b7fa6;
    --amethyst-deep: #6f5580;
    --gold: #bfa06a;
    --white: #fffdfb;
    --line: rgba(42,33,48,0.12);
    --shadow: 0 20px 60px -20px rgba(111,85,128,0.35);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ scroll-behavior:smooth; }

  body{
    font-family:'Manrope', sans-serif;
    background:
      radial-gradient(120% 80% at 15% -10%, rgba(226,206,190,0.4), transparent 60%),
      radial-gradient(120% 80% at 90% 0%, rgba(214,190,170,0.3), transparent 55%),
      linear-gradient(180deg, var(--pearl), var(--white));
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
  }

  /* ---------- ambient facets ---------- */
  .facet-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .facet-bg span{
    position:absolute;
    background:linear-gradient(135deg, rgba(255,255,255,0.6), rgba(214,190,170,0.18));
    clip-path:polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    opacity:0.5;
    filter:blur(0.2px);
  }
  .facet-bg span:nth-child(1){ width:120px; height:140px; top:8%; left:6%; transform:rotate(-12deg); opacity:0.35; }
  .facet-bg span:nth-child(2){ width:70px; height:82px; top:20%; right:10%; transform:rotate(20deg); opacity:0.3; }
  .facet-bg span:nth-child(3){ width:50px; height:58px; bottom:14%; left:12%; transform:rotate(8deg); opacity:0.25; }
  .facet-bg span:nth-child(4){ width:90px; height:104px; bottom:6%; right:8%; transform:rotate(-18deg); opacity:0.3; }

  .wrap{
    position:relative; z-index:1;
    max-width:560px;
    margin:0 auto;
    padding:64px 24px 48px;
  }

  /* ---------- hero ---------- */
  .hero{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-bottom:40px;
  }

  .gem{
    width:96px; height:110px;
    margin-bottom:22px;
    animation: float 5s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform:translateY(0px); }
    50%{ transform:translateY(-8px); }
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--amethyst-deep);
    font-weight:700;
    margin-bottom:18px;
  }

  .eyebrow::before,.eyebrow::after{
    content:'';
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:clamp(44px, 11vw, 64px);
    letter-spacing:0.01em;
    line-height:1;
    color:var(--ink);
  }

  .subtitle{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:400;
    font-size:20px;
    color:var(--ink-soft);
    margin-top:8px;
    letter-spacing:0.04em;
  }

  .tagline{
    margin-top:20px;
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink-soft);
    max-width:340px;
  }

  /* ---------- shop section ---------- */
  .shop-head{
    display:flex;
    align-items:center;
    gap:14px;
    margin:44px 0 22px;
  }
  .shop-head::before, .shop-head::after{
    content:'';
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--line), transparent);
  }
  .shop-head h2{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-style:italic;
    font-size:24px;
    color:var(--amethyst-deep);
    white-space:nowrap;
  }

  .links{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
  }

  .card{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    width:76px;
    height:76px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:50%;
    text-decoration:none;
    color:var(--amethyst-deep);
    box-shadow:0 1px 0 rgba(255,255,255,0.6) inset;
    transition:transform 0.35s cubic-bezier(.2,.8,.2,1), box-shadow 0.35s ease, border-color 0.35s ease;
    overflow:hidden;
  }

  .card::before{
    content:'';
    position:absolute;
    top:0; left:-140%;
    width:60%; height:100%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,0.85), transparent);
    transform:skewX(-18deg);
    transition:left 0.7s ease;
  }
  .card:hover::before{ left:140%; }

  .card:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow);
    border-color:rgba(155,127,166,0.4);
  }

  .card:focus-visible{
    outline:2px solid var(--amethyst-deep);
    outline-offset:3px;
  }

  .card svg{ width:28px; height:28px; }

  .card.cs{ color:#4a9a63; }

  .flag{
    position:absolute;
    bottom:4px;
    right:4px;
    font-size:15px;
    line-height:1;
    background:var(--white);
    border-radius:50%;
    width:20px; height:20px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 4px rgba(42,33,48,0.25);
  }

  /* ---------- footer ---------- */
  footer{
    margin-top:56px;
    text-align:center;
  }

  .ig{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--ink-soft);
    text-decoration:none;
    padding:8px 16px;
    border:1px solid var(--line);
    border-radius:999px;
    transition:border-color 0.3s ease, color 0.3s ease;
  }
  .ig:hover{ border-color:var(--amethyst-deep); color:var(--amethyst-deep); }
  .ig svg{ width:14px; height:14px; }

  .copyright{
    margin-top:18px;
    font-size:11px;
    letter-spacing:0.06em;
    color:rgba(42,33,48,0.4);
  }

  @media (max-width:380px){
    .wrap{ padding:48px 16px 36px; }
    .card{ padding:16px 18px; gap:12px; }
  }
</style>
</head>
<body>

<div class="facet-bg" aria-hidden="true">
  <span></span><span></span><span></span><span></span>
</div>

<div class="wrap">

  <section class="hero">
    <h1>Zupazupazuu</h1>
    <p class="subtitle">Crystal Jewelry</p>
  </section>

  <div class="shop-head">
    <h2>Belanja di</h2>
  </div>

  <nav class="links" aria-label="Shopping links">

    <a class="card" href="https://www.tiktok.com/@zupazupazuu?_r=1&_t=ZS-91WkFY1ISlr" target="_blank" rel="noopener noreferrer" aria-label="TikTok Shop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3v9.5a3.5 3.5 0 1 1-3-3.46"/><path d="M15 3c.5 2.6 2.1 4.2 4.5 4.6"/></svg>
    </a>

    <a class="card" href="https://shopee.co.id/zupazupazuu_id?entryPoint=ShopBySearch&searchKeyword=zupazupazuu%20crystal%20jewelry" target="_blank" rel="noopener noreferrer" aria-label="Shopee Indonesia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="flag">🇮🇩</span>
    </a>

    <a class="card" href="https://shopee.com.my/zupazupazuu9sh.my" target="_blank" rel="noopener noreferrer" aria-label="Shopee Malaysia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="flag">🇲🇾</span>
    </a>

    <a class="card cs" href="https://api.whatsapp.com/send?phone=6285954893440" target="_blank" rel="noopener noreferrer" aria-label="Customer Service via WhatsApp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 20l1.05-5.4A8.5 8.5 0 1 1 21 11.5Z"/></svg>
    </a>

  </nav>

  <footer>
    <a class="ig" href="https://www.instagram.com/zupazupazuu/" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
      @zupazupazuu
    </a>
    <p class="copyright">© 2015–2026 ZUPAZUPAZUU CRYSTAL JEWELRY</p>
  </footer>

</div>

</body>
</html>
